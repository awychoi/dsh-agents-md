<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">AGENTS.md editor in the DSH right sidebar, dark theme</title>
  <desc id="desc">An illustrative dark-theme layout of DeepSeek Harness with the AGENTS.md tab open in the right sidebar: an editor with Save and Reload controls, a Git visibility switch, and an Unsaved indicator.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d1f"/>
      <stop offset="1" stop-color="#171719"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity=".62"/>
    </filter>
    <style>
      .bg { fill: #0f1115; }
      .panel { fill: url(#panel); stroke: #2c2c2e; stroke-width: 1; }
      .rail { fill: #151517; }
      .chat { fill: #1b1b1c; }
      .line { stroke: #2c2c2e; stroke-width: 1; }
      .muted { fill: #979da6; }
      .secondary { fill: #adb2b8; }
      .ink { fill: #f5f5f5; }
      .accent { fill: #4d93f8; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .pill { fill: #2c2c2e; }
      .btn { fill: #f5f5f5; }
      .btn-text { fill: #0f1115; }
      .warn { fill: #f7ad31; }
      .warn-bg { fill: #27241f; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>

  <!-- Window frame -->
  <rect x="28" y="24" width="1144" height="672" rx="18" class="panel" filter="url(#shadow)"/>

  <!-- Left rail -->
  <path d="M46 24h236v672H46a18 18 0 0 1-18-18V42a18 18 0 0 1 18-18z" class="rail"/>
  <line x1="282" y1="24" x2="282" y2="696" class="line"/>
  <circle cx="66" cy="54" r="8" fill="#4d93f8"/>
  <rect x="84" y="48" width="72" height="12" rx="6" fill="#43454a"/>
  <rect x="48" y="92" width="206" height="32" rx="9" fill="#2c2c2e"/>
  <rect x="60" y="102" width="92" height="10" rx="5" fill="#d4d4d4"/>
  <rect x="48" y="132" width="190" height="10" rx="5" fill="#353638"/>
  <rect x="48" y="152" width="150" height="10" rx="5" fill="#353638"/>
  <rect x="48" y="172" width="174" height="10" rx="5" fill="#353638"/>
  <rect x="48" y="212" width="118" height="10" rx="5" fill="#545557"/>
  <rect x="48" y="236" width="190" height="26" rx="8" fill="#232324"/>
  <rect x="48" y="272" width="190" height="26" rx="8" fill="#232324"/>
  <rect x="48" y="308" width="190" height="26" rx="8" fill="#232324"/>

  <!-- Chat column -->
  <rect x="282" y="24" width="470" height="672" class="chat"/>
  <line x1="752" y1="24" x2="752" y2="696" class="line"/>
  <rect x="310" y="52" width="188" height="14" rx="7" fill="#f5f5f5"/>
  <rect x="310" y="78" width="92" height="10" rx="5" fill="#61666b"/>
  <circle cx="724" cy="58" r="12" fill="#2c2c2e"/>
  <path d="M718 54h12v9h-12z" fill="none" stroke="#adb2b8" stroke-width="1.3"/>
  <rect x="310" y="138" width="334" height="64" rx="12" fill="#232324"/>
  <rect x="326" y="156" width="256" height="9" rx="4.5" fill="#43454a"/>
  <rect x="326" y="174" width="188" height="9" rx="4.5" fill="#353638"/>
  <rect x="310" y="226" width="290" height="44" rx="10" fill="#172554"/>
  <rect x="326" y="242" width="210" height="9" rx="4.5" fill="#7aaaff"/>
  <rect x="310" y="326" width="334" height="40" rx="10" fill="#232324" stroke="#2c2c2e"/>
  <rect x="326" y="342" width="152" height="8" rx="4" fill="#545557"/>
  <rect x="310" y="598" width="410" height="56" rx="14" fill="#212123" stroke="#2c2c2e"/>
  <rect x="328" y="618" width="220" height="10" rx="5" fill="#545557"/>
  <circle cx="694" cy="626" r="10" fill="#f5f5f5"/>
  <path d="M690 626h8m-3-3 3 3-3 3" fill="none" stroke="#0f1115" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right sidebar -->
  <path d="M752 24h402a18 18 0 0 1 18 18v636a18 18 0 0 1-18 18H752z" fill="#1b1b1c"/>
  <rect x="752" y="24" width="420" height="48" fill="#171718"/>
  <line x1="752" y1="72" x2="1172" y2="72" class="line"/>
  <rect x="768" y="40" width="112" height="18" rx="9" fill="#2c2c2e"/>
  <rect x="782" y="45" width="42" height="8" rx="4" fill="#adb2b8"/>
  <rect x="832" y="45" width="36" height="8" rx="4" fill="#61666b"/>
  <rect x="900" y="40" width="18" height="18" rx="5" fill="#232324"/>
  <rect x="926" y="40" width="18" height="18" rx="5" fill="#232324"/>
  <rect x="958" y="38" width="72" height="22" rx="6" fill="#2c2c2e"/>

  <!-- Editor header -->
  <rect x="768" y="94" width="14" height="14" rx="3" fill="#232324" stroke="#43454a"/>
  <path d="M771 97h5l3 3v5h-8z" fill="none" stroke="#adb2b8" stroke-width="1.1"/>
  <text x="792" y="105" class="ui ink" font-size="15" font-weight="600">AGENTS.md</text>
  <circle cx="884" cy="100" r="3.5" class="warn"/>
  <text x="894" y="104" class="ui warn" font-size="11">Unsaved</text>
  <text x="768" y="126" class="code muted" font-size="10.5">/Users/you/project/AGENTS.md</text>
  <rect x="978" y="90" width="54" height="26" rx="7" fill="#232324" stroke="#353638"/>
  <text x="1005" y="107" class="ui secondary" font-size="11" text-anchor="middle">Reload</text>
  <rect x="1038" y="90" width="54" height="26" rx="7" class="btn"/>
  <text x="1065" y="107" class="ui btn-text" font-size="11" text-anchor="middle">Save</text>
  <line x1="752" y1="138" x2="1172" y2="138" class="line"/>

  <!-- Git switch row -->
  <rect x="768" y="150" width="388" height="32" rx="7" fill="#171718" stroke="#232324"/>
  <rect x="778" y="157" width="30" height="18" rx="9" fill="#545557"/>
  <circle cx="787" cy="166" r="7" fill="#adb2b8"/>
  <text x="818" y="170" class="ui secondary" font-size="10.5">Include AGENTS.md in Git</text>
  <text x="1144" y="170" class="ui muted" font-size="10" text-anchor="end">Ignored by .gitignore</text>

  <!-- Markdown content -->
  <text x="768" y="220" class="code ink" font-size="13" font-weight="700"># AGENTS.md</text>
  <text x="768" y="246" class="code secondary" font-size="11.5">Guidance for AI agents working in this</text>
  <text x="768" y="264" class="code secondary" font-size="11.5">workspace. Edit this file in DSH, then</text>
  <text x="768" y="282" class="code secondary" font-size="11.5">save it. The agent sees the saved file</text>
  <text x="768" y="300" class="code secondary" font-size="11.5">on its next step.</text>

  <text x="768" y="340" class="code ink" font-size="13" font-weight="700">## Project overview</text>
  <text x="768" y="364" class="code muted" font-size="11.5">&lt;!-- What this project is... --&gt;</text>

  <text x="768" y="404" class="code ink" font-size="13" font-weight="700">## Setup and checks</text>
  <text x="768" y="428" class="code muted" font-size="11.5">&lt;!-- Install, build, test... --&gt;</text>

  <text x="768" y="468" class="code ink" font-size="13" font-weight="700">## Conventions</text>
  <text x="768" y="492" class="code muted" font-size="11.5">&lt;!-- Style, structure, review... --&gt;</text>

  <rect x="768" y="514" width="388" height="1" class="line"/>

  <!-- Footer -->
  <text x="768" y="668" class="ui muted" font-size="10.5">12 lines · 428 characters</text>
  <text x="1154" y="668" class="ui warn" font-size="10.5" text-anchor="end">Draft kept, not saved</text>

</svg>
